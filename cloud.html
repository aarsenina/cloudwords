<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Облако слов Учи.ру</title>
  <style>
    @font-face { 
      font-family: 'Factor A'; 
      src: url('TRIAL_FactorA-Regular.otf') format('opentype'); 
    }
    @font-face { 
      font-family: 'Factor A'; 
      src: url('TRIAL_FactorA-Bold.otf') format('opentype'); 
      font-weight: bold; 
    }
    
    * { box-sizing: border-box; }

    body {
      font-family: 'Factor A', sans-serif;
      background-color: #1A1635;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    #cloud-container {
      position: relative;
      width: 95vw;
      height: 95vh;
    }

    .word {
      position: absolute;
      font-weight: bold;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
      user-select: none;
      transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      transform: scale(0.3);
    }

    .word.visible {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body>

  <div id="cloud-container"></div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycby6UAPwoqZQlQcjzRdY7jL0XY6CykpZ9yhDksu5ese64l4OMcEGsM8PaVDscmPfTBqA/exec'; 
    const container = document.getElementById('cloud-container');
    
    // Исправлен комментарий!
    const PALETTE = [
      '#DCFF85', // Салатовый (лидеры)
      '#FF5855', // Коралловый / Красный
      '#A091FF', // Фиолетовый / Сиреневый
      '#A3DAFF', // Голубой
      '#FFC4C4', // Нежно-розовый
      '#FFD633', // Желтый
      '#FFF3A1', // Светло-желтый
      '#FFFFFF'  // Белый
    ];

    let wordElements = {};

    function fetchWords() {
      // Добавил защиту от кэширования для экрана (чтобы всегда запрашивал свежие слова)
      fetch(scriptURL + '?t=' + new Date().getTime())
        .then(res => res.json())
        .then(data => {
          renderCloud(data);
        })
        .catch(err => console.error("Ошибка обновления:", err));
    }

    function renderCloud(newData) {
      const containerWidth = container.clientWidth;
      const containerHeight = container.clientHeight;
      const centerX = containerWidth / 2;
      const centerY = containerHeight / 2;

      // Сортируем слова по убыванию частоты
      const sortedWords = Object.keys(newData).sort((a, b) => newData[b] - newData[a]);
      if (sortedWords.length === 0) return;

      const maxCount = newData[sortedWords[0]];
      const minCount = newData[sortedWords[sortedWords.length - 1]];

      const placedBoxes = [];

      sortedWords.forEach((word, index) => {
        const count = newData[word];
        let el = wordElements[word];

        if (!el) {
          el = document.createElement('div');
          el.className = 'word';
          el.textContent = word;
          container.appendChild(el);
          wordElements[word] = el;
        }

        // Расчет размера шрифта
        const minSize = Math.max(16, containerWidth * 0.018);
        const maxSize = Math.min(110, containerWidth * 0.08);
        const fontSize = maxCount === minCount 
          ? (minSize + maxSize) / 2 
          : minSize + ((count - minCount) / (maxCount - minCount)) * (maxSize - minSize);

        el.style.fontSize = fontSize + 'px';

        if (count === maxCount && count > 1) {
          el.style.color = '#DCFF85'; 
        } else {
          el.style.color = PALETTE[(index + word.length) % PALETTE.length];
        }

        const rotation = ((word.length % 5) - 2) * 3;
        el.style.transform = `rotate(${rotation}deg)`;

        const wordWidth = el.offsetWidth || (word.length * fontSize * 0.65);
        const wordHeight = el.offsetHeight || (fontSize * 1.1);

        let angle = (index * 137.5) * (Math.PI / 180); 
        let radius = 0;
        const step = 0.3;
        let x = centerX - wordWidth / 2;
        let y = centerY - wordHeight / 2;

        let placed = false;
        let attempts = 0;

        while (!placed && attempts < 800) {
          x = centerX + radius * Math.cos(angle) * 1.3 - wordWidth / 2;
          y = centerY + radius * Math.sin(angle) * 0.7 - wordHeight / 2;

          const inBounds = x >= 10 && y >= 10 && (x + wordWidth) <= (containerWidth - 10) && (y + wordHeight) <= (containerHeight - 10);

          if (inBounds && !checkOverlap(x, y, wordWidth, wordHeight, placedBoxes)) {
            placed = true;
            placedBoxes.push({ x, y, w: wordWidth, h: wordHeight });
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.classList.add('visible');
          }

          angle += step;
          radius = 5 * angle;
          attempts++;
        }

        if (!placed) {
          el.classList.remove('visible');
        }
      });
    }

    function checkOverlap(x, y, w, h, boxes) {
      const padding = 12; 
      for (let box of boxes) {
        if (
          x < box.x + box.w + padding &&
          x + w + padding > box.x &&
          y < box.y + box.h + padding &&
          y + h + padding > box.y
        ) {
          return true; 
        }
      }
      return false;
    }

    setInterval(fetchWords, 4000);
    fetchWords();
  </script>
</body>
</html>
