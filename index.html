<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Отправь слово!</title>
  <style>
    @font-face {
      font-family: 'Factor A';
      src: url('TRIAL_FactorA-Regular.otf') format('opentype'); 
    }
    @font-face {
      font-family: 'Factor A';
      src: url('TRIAL_FactorA-Bold.otf') format('opentype'); 
      font-weight: bold;
    }
    body {
      font-family: 'Factor A', sans-serif;
      background-color: #1A1635;
      color: #A498FF;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background-color: #352B6A;
      padding: 30px 20px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1 { color: #DCFF85; font-size: 24px; margin-top: 0; text-transform: uppercase; }
    input {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-family: 'Factor A', sans-serif;
      background-color: #1A1635;
      color: #FFF;
      border: 2px solid #A498FF;
      border-radius: 12px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }
    input:focus { outline: none; border-color: #DCFF85; }
    button {
      width: 100%;
      background-color: #DCFF85;
      color: #1A1635;
      border: none;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Factor A', sans-serif;
    }
    .message { margin-top: 15px; font-weight: bold; min-height: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>НАПИШИ СЛОВО</h1>
    <form id="wordForm">
      <input type="text" id="wordInput" placeholder="Например: Семья" required autocomplete="off" maxlength="20">
      <button type="submit" id="submitBtn">Отправить</button>
    </form>
    <div id="msg" class="message"></div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycby6UAPwoqZQlQcjzRdY7jL0XY6CykpZ9yhDksu5ese64l4OMcEGsM8PaVDscmPfTBqA/exec'; 
    
    const form = document.getElementById('wordForm');
    const input = document.getElementById('wordInput');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
      e.preventDefault();
      const word = input.value.trim();
      if (!word) return;

      btn.disabled = true;
      btn.textContent = 'Отправляем...';
      
      const formData = new URLSearchParams();
      formData.append('word', word);

      // Добавлен режим mode: 'no-cors' для обхода блокировок Safari
      fetch(scriptURL, { method: 'POST', body: formData, mode: 'no-cors' })
        .then(() => {
          msg.textContent = 'Слово улетело на экран! ✨';
          msg.style.color = '#DCFF85';
          input.value = '';
          setTimeout(() => { msg.textContent = ''; }, 3000);
        })
        .catch(() => {
          msg.textContent = 'Ошибка :( Попробуй еще раз.';
          msg.style.color = '#FF6B6B';
        })
        .finally(() => {
          btn.disabled = false;
          btn.textContent = 'Отправить еще';
          input.focus();
        });
    });
  </script>
</body>
</html>
